{% load static ui_i18n %}
<div class="mtu-loader" hidden role="status" aria-live="polite" aria-label="{% tr 'loader_page_loading' %}"
  data-authenticated="{{ user.is_authenticated|yesno:'true,false' }}"
  data-initializing="{% tr 'loader_initializing' %}"
  data-assets="{% tr 'loader_assets' %}"
  data-almost-ready="{% tr 'loader_almost_ready' %}"
  data-welcome="{% tr 'loader_welcome' %}">
  <div class="mtu-loader__stage">
    <div class="mtu-loader__orbit" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="mtu-loader__content">
      <img class="mtu-loader__emblem" src="{% static 'img/mtu-loader-emblem.png' %}" width="1084" height="1120" alt="{% tr 'loader_branch' %}" fetchpriority="high">
      <div class="mtu-loader__kicker">
        <i aria-hidden="true"></i>
        <span>{% tr 'loader_branch' %} <strong>{% tr 'loader_department' %}</strong></span>
      </div>
      <div class="mtu-loader__logo" aria-hidden="true"><span>MTU FORUM</span></div>
      <div class="mtu-loader__progress">
        <div class="mtu-loader__meta">
          <span data-loader-label>{% tr 'loader_initializing' %}</span>
          <strong><span data-loader-percent>000</span><small>%</small></strong>
        </div>
        <div class="mtu-loader__track"><span data-loader-bar></span></div>
      </div>
    </div>
  </div>
  <div class="mtu-loader__corner" aria-hidden="true"><i></i><i></i><i></i></div>
</div>
