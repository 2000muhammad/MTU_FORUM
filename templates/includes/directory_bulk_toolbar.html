<form method="post" id="{{ bulk_form_id }}" class="directory-bulk-toolbar">
  {% csrf_token %}
  <input type="hidden" name="section" value="{{ bulk_section }}">
  <label class="check-line"><input class="form-check-input" type="checkbox" data-select-all="{{ bulk_form_id }}"> Выбрать все</label>
  <span class="directory-selected-count" data-selected-count="{{ bulk_form_id }}">Выбрано: 0</span>
  <button class="btn btn-outline-success btn-sm" name="action" value="bulk_activate">Включить</button>
  <button class="btn btn-outline-warning btn-sm" name="action" value="bulk_deactivate">Отключить</button>
  <button class="btn btn-outline-danger btn-sm" name="action" value="bulk_delete" data-directory-bulk-delete>Удалить выбранное</button>
</form>
